[package]
name = "teamos-desktop"
version = "0.1.0"
description = "TeamOS desktop app"
edition = "2021"
publish = false

[lib]
name = "teamos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `dynamic-acl` lets the shell grant IPC access to an instance URL that was not
# known at build time; without it only the instances in `capabilities/` work.
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
